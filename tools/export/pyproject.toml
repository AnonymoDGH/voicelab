[project]
name = "voicelab-export"
version = "0.1.0"
description = "Dev-time tooling: MeanVC2 checkpoints -> ONNX graphs, golden fixtures and voice files for VoiceLab"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy>=1.26,<2.1",
    "einops>=0.8",
    "x-transformers==2.2.11",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "librosa>=0.10",
    "huggingface-hub>=0.25",
    "gdown>=5",
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
