[workspace]
resolver = "3"
members = ["crates/voicelab-core", "crates/voicelab-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AnonymoDGH/voicelab"

[workspace.dependencies]
anyhow = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }
realfft = "3.5"
rubato = "5"
audioadapter-buffers = "5.2"
cpal = "0.18"
rtrb = "0.3"
safetensors = "0.8"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rand = "0.10"
rand_distr = "0.6"
dirs = "7"
ureq = "3"
clap = { version = "4.6", features = ["derive"] }
voicelab-core = { path = "crates/voicelab-core" }

[profile.release]
lto = "thin"
codegen-units = 1
