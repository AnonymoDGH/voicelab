name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Motor (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p voicelab-core -p voicelab-cli --all-targets -- -D warnings
      # Pipeline/model tests skip without VOICELAB_MODELS; DSP and real-time logic tests always run.
      - run: cargo test -p voicelab-core

  ui:
    name: Interfaz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: Instalador (Windows)
    runs-on: windows-latest
    needs: [core, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cargo build --release -p voicelab-cli
      - run: npm ci
        working-directory: app
      - run: npm run tauri build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: voicelab-windows
          path: |
            target/release/voicelab.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
