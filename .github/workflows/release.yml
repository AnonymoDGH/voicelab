name: Release

# Push a tag like v0.1.0 to build the Windows installer, export the models and publish a
# GitHub release with everything attached. The app downloads its models from the release
# matching its version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  models:
    name: Modelos ONNX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Exportar MeanVC2 a ONNX
        working-directory: tools/export
        run: |
          uv sync
          uv run python download.py
          uv run python export_onnx.py --out ../../models
          uv run python quantize.py --models ../../models
      - name: Dejar solo lo que descarga la app
        run: rm models/spk_encoder.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/
          if-no-files-found: error

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cargo build --release -p voicelab-cli
      - run: npm ci
        working-directory: app
      - run: npm run tauri build
        working-directory: app
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          New-Item -ItemType Directory cli/voicelab | Out-Null
          Copy-Item target/release/voicelab.exe cli/voicelab/
          # ONNX Runtime is linked statically; ship any runtime DLL the build still produced.
          Get-ChildItem target/release -Filter *.dll | ForEach-Object { Write-Host "dll: $($_.Name)"; Copy-Item $_.FullName cli/voicelab/ }
          Copy-Item -Recurse voices cli/voicelab/voices
          Copy-Item LICENSE, NOTICE, THIRD_PARTY.md cli/voicelab/
          Compress-Archive -Path cli/voicelab -DestinationPath dist/voicelab-cli-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [models, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: VoiceLab ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            artifacts/windows/*
            artifacts/models/*
          fail_on_unmatched_files: true
