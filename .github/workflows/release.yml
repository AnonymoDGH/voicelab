name: Release

# Builds the Windows installer, exports the models and publishes a GitHub release with
# everything attached. Triggers: a tag like v0.1.0, a manual run with a version, or a push whose
# commit message contains [release] (publishes v<version from Cargo.toml>). The app downloads
# its models from the release matching its version.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, sin la v (ej. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Versión
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="v$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; fi
          echo "Publicando $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  models:
    name: Modelos ONNX
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Exportar MeanVC2 a ONNX
        working-directory: tools/export
        run: |
          uv sync
          uv run python download.py
          uv run python export_onnx.py --out ../../models
          uv run python quantize.py --models ../../models
      - name: Dejar solo lo que descarga la app
        run: rm models/spk_encoder.onnx models/bwe_16k_48k.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/
          if-no-files-found: error

  windows:
    name: Instalador Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cargo build --release -p voicelab-cli
      - run: npm ci
        working-directory: app
      - run: npm run tauri build
        working-directory: app
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          New-Item -ItemType Directory cli/voicelab | Out-Null
          Copy-Item target/release/voicelab.exe cli/voicelab/
          # ONNX Runtime is linked statically; ship any runtime DLL the build still produced.
          Get-ChildItem target/release -Filter *.dll | ForEach-Object { Write-Host "dll: $($_.Name)"; Copy-Item $_.FullName cli/voicelab/ }
          Copy-Item -Recurse voices cli/voicelab/voices
          Copy-Item LICENSE, NOTICE, THIRD_PARTY.md cli/voicelab/
          Compress-Archive -Path cli/voicelab -DestinationPath dist/voicelab-cli-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [meta, models, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VoiceLab ${{ needs.meta.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            artifacts/windows/*
            artifacts/models/*
          fail_on_unmatched_files: true
